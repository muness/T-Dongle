name: release
# Push a tag like v0.2.0 to build the firmware, attach it to a GitHub release and publish the
# browser flash page (site/index.html) to GitHub Pages from the gh-pages branch.
# workflow_dispatch builds only (dry_run defaults to true); it publishes nothing unless it is run
# from a v* tag with dry_run=false.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify only; skip the GitHub release and Pages publish
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-pages
  cancel-in-progress: false
jobs:
  build:
    # Prepared ESP-IDF v5.5.5 fleet runner when LOCAL_LINUX_CI_ENABLED is true, as in build.yml;
    # otherwise a GitHub-hosted runner that bootstraps the pinned IDF.
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'muness/T-Dongle' && fromJSON('["self-hosted","linux","x64","builder:d14d43a864db3537e8e9"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      PREPARED_IDF: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'muness/T-Dongle' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dryrun"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - if: env.PREPARED_IDF != 'true'
        name: Install Go for control protocol interoperability tests
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - if: env.PREPARED_IDF != 'true'
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3-venv cmake ninja-build ccache libffi-dev libssl-dev libusb-1.0-0
      - if: env.PREPARED_IDF != 'true'
        run: tools/bootstrap.sh
      - name: Test and build (hosted, bootstrapped ESP-IDF)
        if: env.PREPARED_IDF != 'true'
        shell: bash
        run: |
          export TDONGLE_VERSION='${{ steps.ver.outputs.version }}'
          . "$HOME/.cache/tdongle/esp-idf-v5.5.5/export.sh"
          tools/ci.sh release
      - name: Test and build (prepared ESP-IDF v5.5.5 runner)
        if: env.PREPARED_IDF == 'true'
        shell: bash
        run: |
          set -e
          export TDONGLE_VERSION='${{ steps.ver.outputs.version }}'
          # Tools (including Go) are baked into the approved runner; no Docker socket, image pull or download.
          git config --global --add safe.directory /opt/esp/idf
          . /opt/esp/idf/export.sh
          idf.py --version | grep -Fx 'ESP-IDF v5.5.5'
          echo "IDF_PATH=$IDF_PATH commit=$(git -C "$IDF_PATH" rev-parse HEAD)"
          tools/ci.sh release
      - name: Verify package version and assemble flash page
        shell: bash
        run: |
          set -e
          VERSION='${{ steps.ver.outputs.version }}'
          PKG="dist/tdongle-$VERSION"
          # Tag, package manifest, app descriptor and the firmware's reported version must all agree.
          python3 -c "import json,sys; m=json.load(open('$PKG/manifest.json')); assert m['version']=='$VERSION' and m['flash_mode']=='dio' and m['flash_freq']=='40m', m"
          grep -aq "firmware=$VERSION" "$PKG/app.bin"
          python3 tools/site.py "$PKG" "$VERSION" site-out
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: |
            dist/tdongle-${{ steps.ver.outputs.version }}.tar.gz
            dist/tdongle-${{ steps.ver.outputs.version }}.tar.gz.sha256
            dist/tdongle-${{ steps.ver.outputs.version }}/
            site-out/
  publish:
    # Always runs so dry runs exercise routing and the artifact layout; the release and Pages steps
    # run only for a v* tag (tag push, or tag dispatch with dry_run=false).
    needs: build
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'muness/T-Dongle' && fromJSON('["self-hosted","linux","x64","linux-general"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.dry_run == false) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build.outputs.version }}
      - name: Verify release files
        run: |
          echo "publish=$PUBLISH runner=$RUNNER_NAME"
          ls -l "dist/tdongle-$VERSION.tar.gz" "dist/tdongle-$VERSION.tar.gz.sha256" \
            "dist/tdongle-$VERSION/app.bin" "dist/tdongle-$VERSION/bootloader.bin" \
            "dist/tdongle-$VERSION/partition-table.bin" site-out/index.html site-out/manifest.json
          (cd dist && sha256sum -c "tdongle-$VERSION.tar.gz.sha256")
          # The flash page manifest must list bootloader, partition table and app (no merged image: it would erase NVS).
          python3 - <<PY
          import json,os
          m=json.load(open('site-out/manifest.json'))
          parts=m['builds'][0]['parts']
          assert [p['offset'] for p in parts]==[0,0x8000,0x20000], parts
          assert all(os.path.getsize('site-out/'+p['path'])>0 for p in parts)
          assert m['version']=='$VERSION', m
          PY
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "T-Dongle $GITHUB_REF_NAME" --generate-notes \
            "dist/tdongle-$VERSION.tar.gz" "dist/tdongle-$VERSION.tar.gz.sha256" \
            "dist/tdongle-$VERSION/app.bin#app.bin (0x20000)" \
            "dist/tdongle-$VERSION/bootloader.bin#bootloader.bin (0x0)" \
            "dist/tdongle-$VERSION/partition-table.bin#partition-table.bin (0x8000)"
      - name: Publish flash page
        if: env.PUBLISH == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: site-out
          keep_files: true
          commit_message: "Publish flash page for ${{ github.ref_name }}"

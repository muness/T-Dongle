name: rust-port
# The Rust (esp-rs) port lives in rust/ (ADR: rust/docs/adr/0001-rust-port.md). This workflow is separate from the C firmware's, which is untouched.
# Hosted runners on purpose: the prepared fleet runner has ESP-IDF but no Xtensa Rust toolchain; the toolchain is installed with espup and cached.
on:
  push:
    branches: [main]
    paths: ['rust/**', '.github/workflows/rust.yml', 'partitions.csv']
  pull_request:
    paths: ['rust/**', '.github/workflows/rust.yml', 'partitions.csv']
  workflow_dispatch:
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  ESPUP_VERSION: v0.17.1
  XTENSA_RUST_VERSION: 1.97.0.0
jobs:
  host:
    # Pure crates: no hardware, no ESP-IDF. Stable Rust, plus Miri and loom on the crates that have unsafe or lock-free code.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: {run: {working-directory: rust}}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: 'rustfmt, clippy'}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: rust}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Boot order of the no_std images (rule 13)
        run: python3 tools/check_boot_order.py firmware/src/main.rs spikes/s1-wifi-l2/src/main.rs
      - name: Rescue arm first (every image)
        run: python3 tools/check_rescue_first.py
      - name: Golden files are reproducible from the C sources
        run: |
          crates/tdongle-serial/tools/regen.sh
          crates/tdongle-nvs-format/tools/regen.sh
          git diff --exit-code -- crates/tdongle-serial/tests/golden crates/tdongle-nvs-format/tests/golden
      - name: loom (slot queue data-race freedom)
        run: RUSTFLAGS="--cfg loom" cargo test -p tdongle-spsc --test loom_spsc --release
      - name: Miri (unsafe in the slot queue and the USB ring)
        run: |
          rustup toolchain install nightly --profile minimal --component miri
          MIRIFLAGS="-Zmiri-ignore-leaks" cargo +nightly miri test -p tdongle-spsc -p tdongle-usb-ring -p tdongle-usb-descriptors -p tdongle-traffic
          MIRIFLAGS="-Zmiri-ignore-leaks" cargo +nightly miri test -p tdongle-bridge --lib -- cases::
  fuzz-build:
    # The fuzz targets must keep compiling; running them is a scheduled/manual job (cargo fuzz run <target> -- -max_total_time=...).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install --locked cargo-fuzz
      - run: cd rust && cargo +nightly fuzz build
  firmware:
    # The esp32s3 no_std image: Xtensa Rust toolchain (espup, cached), then rust/tools/build.sh,
    # which builds, makes the images and checks them (ELF hash in the app descriptor, rescue-first, boot order). Never flashes.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3-venv cmake ninja-build ccache libffi-dev libssl-dev libusb-1.0-0 libclang-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.cargo/bin/ldproxy
            ~/.cargo/bin/espflash
            ~/.cargo/bin/espup
          key: xtensa-${{ env.ESPUP_VERSION }}-${{ env.XTENSA_RUST_VERSION }}-${{ runner.os }}
      - name: Install the Xtensa toolchain, ldproxy and espflash (cache miss only)
        run: |
          if [ ! -d "$HOME/.rustup/toolchains/esp" ]; then
            curl -fsSL -o /usr/local/bin/espup "https://github.com/esp-rs/espup/releases/download/${ESPUP_VERSION}/espup-x86_64-unknown-linux-gnu" || exit 1
            chmod +x /usr/local/bin/espup
            espup install --targets esp32s3 --toolchain-version "${XTENSA_RUST_VERSION}" --export-file "$HOME/export-esp.sh"
          fi
          command -v ldproxy || cargo install --locked ldproxy@0.3.5
          command -v espflash || cargo install --locked espflash@4.6.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target-xtensa
          key: rust-fw-${{ hashFiles('rust/firmware/Cargo.lock') }}
          restore-keys: rust-fw-
      - run: rust/tools/build.sh
      - name: Size against the C image (1,333,360 B)
        run: |
          ls -l rust/dist/*/app.bin | awk '{print "Rust app.bin: " $5 " bytes (C v0.3.0: 1333360)"}' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tdongle-rust-firmware
          path: rust/dist/tdongle-rust-*/

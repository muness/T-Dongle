name: firmware-and-host-tests
on:
  push:
    branches: ["codex/release-paid-companion", "main", "overhaul/multi-tailnet", "tdongle/integration"]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Keep one current validation run per source branch, including manual runs.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  host:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, linux-general]
    steps:
      - uses: actions/checkout@v4
      - run: TEST_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tools/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-previews
          path: docs/preview-*.svg
  firmware:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, linux-general]
    strategy:
      matrix:
        variant: [full, headless, network-only]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3-venv cmake ninja-build ccache libffi-dev libssl-dev libusb-1.0-0
      - run: tools/bootstrap.sh
      - shell: bash
        run: |
          . "$HOME/.cache/tdongle/esp-idf-v5.5.5/export.sh"
          tools/test.sh
          VERSION="0.2.${GITHUB_RUN_NUMBER}"
          TDONGLE_VERSION="$VERSION" tools/build.sh '${{ matrix.variant }}'
          if [ '${{ matrix.variant }}' = full ]; then
            python3 tools/android_manifest.py "dist/tdongle-$VERSION-full" "$VERSION"
            python3 -c 'import json,os,pathlib; pathlib.Path("dist/preview.json").write_text(json.dumps({"channel":"pr-test","commit":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"],"hardwareTested":False}))'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: tdongle-preview-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            dist/tdongle-0.2.*-${{ matrix.variant }}/
            dist/preview.json

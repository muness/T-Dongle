name: firmware-and-host-tests
# Branch pushes only build main; a PR branch is built once, by its pull_request run.
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  host:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, linux-general]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: TEST_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' tools/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-previews
          path: docs/preview-*.svg
  firmware:
    # Same-repo events use the prepared ESP-IDF v5.5.5 fleet runner (no image pull, no tool
    # download) when the LOCAL_LINUX_CI_ENABLED repository variable is true. Fork PRs and a disabled
    # variable fall back to a GitHub-hosted runner that bootstraps the pinned IDF as before.
    runs-on: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'muness/T-Dongle' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","builder:d14d43a864db3537e8e9"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      PREPARED_IDF: ${{ vars.LOCAL_LINUX_CI_ENABLED == 'true' && github.repository == 'muness/T-Dongle' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      matrix:
        variant: [full, headless, network-only]
    steps:
      - uses: actions/checkout@v4
      - if: env.PREPARED_IDF != 'true'
        run: sudo apt-get update && sudo apt-get install -y git wget flex bison gperf python3-venv cmake ninja-build ccache libffi-dev libssl-dev libusb-1.0-0
      - if: env.PREPARED_IDF != 'true'
        run: tools/bootstrap.sh
      - name: Build (hosted, bootstrapped ESP-IDF)
        if: env.PREPARED_IDF != 'true'
        shell: bash
        run: |
          . "$HOME/.cache/tdongle/esp-idf-v5.5.5/export.sh"
          tools/test.sh
          tools/build.sh '${{ matrix.variant }}'
      - name: Build (prepared ESP-IDF v5.5.5 runner)
        if: env.PREPARED_IDF == 'true'
        shell: bash
        run: |
          set -e
          # Tools are baked into the approved runner; no Docker socket, image pull or download.
          git config --global --add safe.directory /opt/esp/idf
          . /opt/esp/idf/export.sh
          idf.py --version | grep -Fx 'ESP-IDF v5.5.5'
          echo "IDF_PATH=$IDF_PATH commit=$(git -C "$IDF_PATH" rev-parse HEAD)"
          tools/test.sh
          tools/build.sh '${{ matrix.variant }}'
      - uses: actions/upload-artifact@v4
        with:
          name: tdongle-0.1.0-${{ matrix.variant }}
          path: dist/tdongle-0.1.0-${{ matrix.variant }}/

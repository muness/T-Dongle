[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
# The workspace is virtual: esp-idf-sys reads its [package.metadata] from this crate.
ESP_IDF_SYS_ROOT_CRATE = "tdongle-fw"
# Build against the pinned ESP-IDF checkout (IDF_PATH, tools from `export.sh`), the same v5.5.5 the C firmware builds with.
ESP_IDF_TOOLS_INSTALL_DIR = "fromenv"

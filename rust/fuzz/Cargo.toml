[package]
name = "tdongle-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace: libfuzzer needs nightly and sanitizer flags that must not leak into the firmware build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tdongle-aqm = { path = "../crates/tdongle-aqm" }
tdongle-lcd = { path = "../crates/tdongle-lcd" }
tdongle-serial = { path = "../crates/tdongle-serial" }
tdongle-nvs-format = { path = "../crates/tdongle-nvs-format" }
tdongle-usb-descriptors = { path = "../crates/tdongle-usb-descriptors" }
tdongle-setup = { path = "../crates/tdongle-setup" }

[[bin]]
name = "ecn_classify"
path = "fuzz_targets/ecn_classify.rs"
test = false
doc = false

[[bin]]
name = "command_line"
path = "fuzz_targets/command_line.rs"
test = false
doc = false

[[bin]]
name = "profile_json"
path = "fuzz_targets/profile_json.rs"
test = false
doc = false

[[bin]]
name = "saved_blobs"
path = "fuzz_targets/saved_blobs.rs"
test = false
doc = false

[[bin]]
name = "lcd_compose"
path = "fuzz_targets/lcd_compose.rs"
test = false
doc = false

[[bin]]
name = "setup_dns"
path = "fuzz_targets/setup_dns.rs"
test = false
doc = false

[[bin]]
name = "setup_http"
path = "fuzz_targets/setup_http.rs"
test = false
doc = false

[[bin]]
name = "setup_router"
path = "fuzz_targets/setup_router.rs"
test = false
doc = false

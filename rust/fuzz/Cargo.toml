[package]
name = "tdongle-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A separate workspace: libfuzzer needs nightly and sanitizer flags that must not leak into the firmware build.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tdongle-aqm = { path = "../crates/tdongle-aqm" }
tdongle-lcd = { path = "../crates/tdongle-lcd" }
tdongle-serial = { path = "../crates/tdongle-serial" }
tdongle-nvs-format = { path = "../crates/tdongle-nvs-format" }
tdongle-nvs-write = { path = "../crates/tdongle-nvs-write", features = ["sim"] }
tdongle-usb-descriptors = { path = "../crates/tdongle-usb-descriptors" }
tdongle-setup = { path = "../crates/tdongle-setup" }

# tailnet crates (phase 3)
tdongle-tailnet-admission = { path = "../crates/tdongle-tailnet-admission" }
tdongle-tailnet-control = { path = "../crates/tdongle-tailnet-control" }
tdongle-tailnet-crypto = { path = "../crates/tdongle-tailnet-crypto" }
tdongle-tailnet-derp = { path = "../crates/tdongle-tailnet-derp" }
tdongle-tailnet-disco = { path = "../crates/tdongle-tailnet-disco", features = ["fuzzing"] }
tdongle-tailnet-dns = { path = "../crates/tdongle-tailnet-dns" }
tdongle-tailnet-map = { path = "../crates/tdongle-tailnet-map" }
tdongle-tailnet-members = { path = "../crates/tdongle-tailnet-members" }
tdongle-tailnet-noise = { path = "../crates/tdongle-tailnet-noise" }
tdongle-tailnet-peers = { path = "../crates/tdongle-tailnet-peers" }
tdongle-tailnet-router = { path = "../crates/tdongle-tailnet-router" }
tdongle-tailnet-status = { path = "../crates/tdongle-tailnet-status" }
tdongle-tailnet-tls = { path = "../crates/tdongle-tailnet-tls" }
tdongle-tailnet-types = { path = "../crates/tdongle-tailnet-types" }
tdongle-tailnet-usbnet = { path = "../crates/tdongle-tailnet-usbnet" }
tdongle-tailnet-wg = { path = "../crates/tdongle-tailnet-wg" }


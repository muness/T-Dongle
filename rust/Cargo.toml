# Rust (esp-rs) port of the T-Dongle firmware. ADR: docs/adr/0001-rust-port.md.
#
# crates/*   pure logic, #![no_std], host-tested (`cargo +stable test`); no ESP-IDF types, no hardware.
# firmware/  the ESP32-S3 binary (no_std, esp-hal/esp-radio/embassy): its own cargo project (own [workspace], xtensa target), thin glue around the pure crates;
#            build it with rust/tools/build.sh.
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["firmware", "spikes"]

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/muness/T-Dongle"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "allow"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"

[profile.dev]
opt-level = "s"

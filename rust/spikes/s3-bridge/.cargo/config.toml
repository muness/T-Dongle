[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
rustflags = [
  "-C", "link-arg=-Wl,-Tlinkall.x",
  "-C", "link-arg=-nostartfiles",
]

[unstable]
build-std = ["core", "alloc"]

[env]
# Default 1492 would make WifiTxToken::consume_token panic for 1493..=1514 byte Ethernet frames from the USB host.
ESP_RADIO_CONFIG_WIFI_MTU = "1514"

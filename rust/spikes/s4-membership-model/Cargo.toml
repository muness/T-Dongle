[package]
name = "s4-membership-model"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
esp-hal = { version = "~1.2", features = ["esp32s3", "unstable"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "embassy", "esp-alloc"] }
esp-alloc = { version = "0.11", features = ["esp32s3"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
esp-println = { version = "0.18", features = ["esp32s3"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
embassy-executor = "0.10"
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2.1"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
blake2 = { version = "0.11", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize"] }
snow = { version = "0.10", default-features = false, features = ["default-resolver"] }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = "s"

[package]
name = "tdongle-tailnet-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Host (std, tokio) adapter for the tailnet control client driver, and the ts2021 interop test against a real Tailscale control server."

[lints]
workspace = true

[dependencies]
tdongle-tailnet-types = { path = "../tdongle-tailnet-types" }
tdongle-tailnet-crypto = { path = "../tdongle-tailnet-crypto" }
tdongle-tailnet-control = { path = "../tdongle-tailnet-control" }
tdongle-tailnet-map = { path = "../tdongle-tailnet-map" }
tdongle-tailnet-noise = { path = "../tdongle-tailnet-noise" }
tdongle-tailnet-ctl = { path = "../tdongle-tailnet-ctl" }
tdongle-tailnet-runtime = { path = "../tdongle-tailnet-runtime", features = ["embassy-net"] }
tdongle-tailnet-engine = { path = "../tdongle-tailnet-engine" }
tdongle-tailnet-fw = { path = "../tdongle-tailnet-fw" }
tdongle-tailnet-admission = { path = "../tdongle-tailnet-admission" }
tdongle-tailnet-disco = { path = "../tdongle-tailnet-disco" }
tdongle-tailnet-members = { path = "../tdongle-tailnet-members" }
tdongle-tailnet-usbnet = { path = "../tdongle-tailnet-usbnet" }
tdongle-tailnet-status = { path = "../tdongle-tailnet-status" }
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"] }
embassy-sync = "0.8"
critical-section = { version = "1.2", features = ["std"] }
smoltcp = { version = "0.13", default-features = false, features = ["std", "alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns", "socket-tcp-cubic"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "io-util", "sync"] }
embedded-io-adapters = { version = "0.7", features = ["tokio-1"] }
embedded-io-async = "0.7"
serde_json = "1"

[dev-dependencies]
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet", "tcp", "udp", "dns", "dhcpv4"] }
embassy-net-driver = "0.2"

[[bin]]
name = "ts2021-interop"
path = "src/main.rs"

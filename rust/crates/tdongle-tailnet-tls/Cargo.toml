[package]
name = "tdongle-tailnet-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "TLS 1.3 client for the tailnet gateway's DERP connection: embedded-tls with the DERP trust policy of the C (CertName, sha256-raw pin, SPKI-pinned ISRG anchors, SAN-only host names, date checks), a DerpTransport trait and the /derp upgrade request. No allocation."

[lints]
workspace = true

[dependencies]
tdongle-tailnet-types = { path = "../tdongle-tailnet-types" }
embedded-tls = { version = "0.19", default-features = false }
embedded-io-async = "0.7"
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"], optional = true }
sha2 = { version = "0.10", default-features = false }
rand_core = { version = "0.6", default-features = false }
subtle = { version = "2.6", default-features = false }

[features]
default = ["p384"]
# ECDSA P-384 and everything that needs SHA-384/512 (RSA signatures with SHA-384/512, RSA-PSS-SHA384/512). Costs about 130 KB (p384) + 45 KB (sha512) of
# xtensa flash. The Go derper serves a TLS 1.3-only client its RSA chain, which needs none of it; the ECDSA chain (Let's Encrypt X2/YE) does.
p384 = ["dep:p384"]

[dev-dependencies]
tdongle-tailnet-types = { path = "../tdongle-tailnet-types", features = ["test-util"] }
sha2 = { version = "0.10", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
embassy-futures = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

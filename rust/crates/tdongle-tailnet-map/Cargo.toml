[package]
name = "tdongle-tailnet-map"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Bounded streaming JSON tokenizer and Tailscale MapResponse projector for the tailnet gateway: fixed-size state, no allocation, typed events, every drop counted."

[lints]
workspace = true

[dependencies]
tdongle-tailnet-types = { path = "../tdongle-tailnet-types" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
serde = { version = "1", default-features = false }

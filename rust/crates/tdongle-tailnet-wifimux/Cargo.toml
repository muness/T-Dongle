[package]
name = "tdongle-tailnet-wifimux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Wi-Fi data-path multiplexer of the tailnet gateway: one embassy-net-driver radio shared by the device's own stack (embassy-net) and the USB host's NAPT traffic, with next-hop ARP, bounded queues, fairness and counted drops."

[lints]
workspace = true

[features]
# `StackInfo for embassy_net::Stack` and `From<StaticConfigV4> for Ipv4Cfg`.
embassy-net = ["dep:embassy-net"]

[dependencies]
tdongle-tailnet-types = { path = "../tdongle-tailnet-types" }
tdongle-tailnet-usbnet = { path = "../tdongle-tailnet-usbnet" }
tdongle-tailnet-admission = { path = "../tdongle-tailnet-admission" }
embassy-net-driver = "0.2"
embassy-sync = "0.8"
embassy-time = "0.5"
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet"], optional = true }

[dev-dependencies]
tdongle-tailnet-wifimux = { path = ".", features = ["embassy-net"] }
tdongle-tailnet-types = { path = "../tdongle-tailnet-types", features = ["test-util"] }
embassy-net = { version = "0.9", default-features = false, features = ["proto-ipv4", "medium-ethernet", "dhcpv4", "tcp", "udp"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-16"] }
critical-section = { version = "1.2", features = ["std"] }
proptest = { version = "1", default-features = false, features = ["std"] }
